name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema, foreign keys, sources
        run: python scripts/validate.py
      - name: JSON export matches CSV
        run: python scripts/export_json.py --check
      - name: Loader example
        run: |
          pip install pandas pyarrow
          python examples/quickstart.py
      - name: Parquet export
        run: python scripts/export_parquet.py dist/parquet
      - name: Upload Parquet
        uses: actions/upload-artifact@v4
        with:
          name: parquet
          path: dist/parquet
